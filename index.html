<script>/* ============================================================
   RFP Automator — core library (no React). Google auth, Gmail,
   People, Drive, merge engine, MIME builder.
   ============================================================ */

/* ---------- constants ---------- */
var DEFAULT_DISCIPLINES = [
  'Structural', 'MEP', 'Civil', 'Architectural', 'Geotechnical',
  'Acoustics', 'Fire Protection', 'Landscape', 'Other'
];

var DEFAULT_SUBJECT = 'Request for Proposal - {ProjectNumber} {ProjectName} - {ConsultantFirmName}';
var DEFAULT_BODY =
'Dear {Name},\n\n' +
'We are requesting a proposal for the following project: {ProjectNumber} {ProjectName}.\n\n' +
'Client / Addressed To:\n{ClientContact}\n\n' +
'Project Brief:\n{ProjectBrief}\n\n' +
'Basis of Design / System Specs:\n{BODSystem}\n\n' +
'Please find all applicable documents in the following folder / links:\n{FolderLink}\n{WebLinks}\n\n' +
'Please include your proposed fee, scope exclusions, and schedule. Let us know if you have any questions.\n\n' +
'Regards,\n{UserSignature}';

var SCOPES = {
  identity: 'openid email profile',
  send: 'https://www.googleapis.com/auth/gmail.send',
  read: 'https://www.googleapis.com/auth/gmail.readonly',
  settings: 'https://www.googleapis.com/auth/gmail.settings.basic',
  contacts: 'https://www.googleapis.com/auth/contacts.readonly',
  otherContacts: 'https://www.googleapis.com/auth/contacts.other.readonly',
  drive: 'https://www.googleapis.com/auth/drive.file',
  sheets: 'https://www.googleapis.com/auth/spreadsheets',
  gemini: 'https://www.googleapis.com/auth/generative-language.retriever',
  cloud: 'https://www.googleapis.com/auth/cloud-platform', // only asked for if Gemini needs it
};
var ALL_SCOPES = [SCOPES.identity, SCOPES.send, SCOPES.read, SCOPES.settings, SCOPES.contacts, SCOPES.otherContacts, SCOPES.drive, SCOPES.sheets, SCOPES.gemini].join(' ');

var MERGE_TOKENS = ['{Name}', '{ProjectNumber}', '{ProjectName}', '{ClientContact}', '{ProjectBrief}', '{BODSystem}',
  '{FolderLink}', '{WebLinks}', '{ConsultantFirmName}', '{ConsultantType}', '{UserSignature}'];

function uid(p) { return (p || 'id') + '_' + Math.random().toString(36).slice(2, 9); }

/* ---------- text helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function linkify(html) {
  return html.replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)\]'"])/g, function (u) {
    return '<a href="' + u + '">' + u + '</a>';
  });
}
function htmlToText(html) {
  if (!html) return '';
  var s = String(html)
    .replace(/<\s*br\s*\/?>/gi, '\n')
    .replace(/<\/(div|p|li|tr|h[1-6])\s*>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  return s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}
function textToHtml(t) { return linkify(esc(t)).replace(/\n/g, '<br>'); }

/* ---------- merge engine ---------- */
function mergeText(tpl, ctx) {
  return (tpl || '')
    .replace(/\{Name\}/g, ctx.firstName || '')
    .replace(/\{ProjectNumber\}/g, ctx.projectNumber || '')
    .replace(/\{ProjectName\}/g, ctx.projectName || '')
    .replace(/\{ClientContact\}/g, ctx.clientContact || '')
    .replace(/\{ProjectBrief\}/g, ctx.projectBrief || '')
    .replace(/\{BODSystem\}/g, ctx.bod || 'N/A')
    .replace(/\{FolderLink\}/g, ctx.folderLink || '')
    .replace(/\{WebLinks\}/g, ctx.webLinks || '')
    .replace(/\{ConsultantFirmName\}/g, ctx.firm || '')
    .replace(/\{ConsultantType\}/g, ctx.type || '')
    .replace(/\{UserSignature\}/g, ctx.signature || '')
    .replace(/[ \t]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function buildContext(project, consultant) {
  var webLinks = (project.links || [])
    .filter(function (l) { return l.url; })
    .map(function (l) { return (l.cat ? l.cat + ' - ' : '') + (l.title ? l.title + ': ' : '') + l.url; })
    .join('\n');
  return {
    firstName: (consultant.name || '').trim().split(/\s+/)[0] || '',
    firm: consultant.firm || 'Consulting Team',
    type: consultant.type || '',
    projectNumber: project.projectNumber,
    projectName: project.projectName,
    clientContact: project.clientContact,
    projectBrief: project.projectBrief,
    bod: (project.bod || {})[consultant.type] || '',
    folderLink: project.folderLink || '',
    webLinks: webLinks,
  };
}

var SIG_MARK = '\u0001SIG\u0001';
/* Returns {subject, text, html}. sigHtml = Gmail signature HTML (or fallback converted). */
/* ---------- rich text: bold section headings, bullet / numbered lists, **bold** ---------- */
var H_OPEN = '\u0002', H_CLOSE = '\u0003';
// A template line (not a merged value) ending in ":" (e.g. "Project Brief:") is a section heading.
function markHeadings(tpl) {
  return tpl.split('\n').map(function (l) {
    var t = l.trim();
    return /^[^{}\n]{1,100}:$/.test(t) ? H_OPEN + t + H_CLOSE : l;
  }).join('\n');
}
var LIST_RE = /^\s*(?:([-*•▪◦])|(\d{1,2})[.)])\s+(.*)$/;
// Inline formatting typed with the toolbar: **bold**, *italic*, __underline__ (never applied inside web links)
var URL_RE = /(https?:\/\/[^\s<*]*[^\s<.,;:!?)\]'"*_])/g;
function fmtInline(h) {
  return h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/__(.+?)__/g, '<u>$1</u>')
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?![*\w])/g, '$1<i>$2</i>');
}
function inlineHtml(s) {
  var parts = String(s).split(URL_RE), out = '';
  for (var i = 0; i < parts.length; i++) {
    var e = esc(parts[i]);
    out += (i % 2) ? '<a href="' + e + '">' + e + '</a>' : fmtInline(e);
